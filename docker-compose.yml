services:
  simulation:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: lead_simulation
    user: developer
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./simulation_ws:/home/developer/simulation_ws:rw
    stdin_open: true
    tty: true
    entrypoint: ["/bin/bash", "-c", "sleep infinity"]
